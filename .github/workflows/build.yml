name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install "Cython<3.0" buildozer

      - name: Принудительное принятие лицензий Android
        run: |
          mkdir -p ~/.android
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> ~/.android/licenses

      - name: Сборка APK
        run: |
          buildozer android debug

      - name: Сохранение готового файла
        uses: actions/upload-artifact@v4
        with:
          name: PlatCubeDL-APK
          path: bin/*.apk
